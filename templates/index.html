<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flask Starter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="page">
      <section class="welcome" aria-labelledby="page-title">
        <p class="eyebrow">A tiny Flask app</p>
        <h1 id="page-title">A good place to start.</h1>
        <p class="intro">Enter your name and let the server say hello.</p>

        <form method="post" class="name-form">
          <label for="name">Your name</label>
          <div class="form-row">
            <input id="name" name="name" type="text" value="{{ name }}" placeholder="e.g. Alex" required>
            <button type="submit">Say hello <span aria-hidden="true">→</span></button>
          </div>
        </form>

        {% if greeting %}
          <p class="greeting" role="status">{{ greeting }}</p>
        {% endif %}
      </section>
      <p class="footnote">Made with Python and Flask</p>
    </main>
  </body>
</html>
